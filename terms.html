      document.title = d.t + ' — Nhalabene';
      document.querySelector('[data-i="t"]').textContent = d.t;

      document.querySelector('[data-i="priv"]').textContent = d.priv;
      document.getElementById('content').innerHTML = d.html;
      document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    }
    document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => { lang = b.dataset.lang; localStorage.setItem('nhalabene-lang', lang); apply(); }));
