    .wrap{max-width:720px;margin:0 auto;padding:1rem 0 3rem}

    .meta{color:var(--muted);font-size:.9rem;margin-bottom:2rem}
    h2{font-size:1.15rem;margin:1.75rem 0 .6rem;color:var(--navy)}
    p,li{margin-bottom:.75rem;font-weight:300}
    ul{padding-left:1.2rem}
    .lang{display:flex;gap:.35rem}
    .lang button{border:1px solid #C9A84C;background:#fff;padding:.35rem .55rem;cursor:pointer;font-size:.75rem;font-weight:600}
    .lang button.active{background:var(--gold);color:var(--navy)}

</head>

    let lang = localStorage.getItem('nhalabene-lang') || 'pt';
    function apply() {
      const d = T[lang] || T.pt;
      document.documentElement.lang = lang === 'pt' ? 'pt-PT' : lang;
      document.title = d.t + ' — Nhalabene';
      document.querySelector('[data-i="t"]').textContent = d.t;
      document.querySelector('[data-i="u"]').textContent = d.u;
      document.querySelector('[data-i="back"]').textContent = d.back;
      document.querySelector('[data-i="terms"]').textContent = d.terms;
      document.getElementById('content').innerHTML = d.html;
      document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    }
    document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => { lang = b.dataset.lang; localStorage.setItem('nhalabene-lang', lang); apply(); }));
    apply();
  </script>
</body>
</html>
